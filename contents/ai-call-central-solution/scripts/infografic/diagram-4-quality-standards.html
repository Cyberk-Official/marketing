<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ai-telemarketing-client-needs — 65% Width Canvas Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Cyberk Solid Design System (NO GRADIENTS) */
            --cyberk-red: #EC2B39;
            --cyberk-blue: #2172E6;
            --cyberk-amber: #F59E0B;
            
            --bg-dark: #07080c;
            --bg-card: #12141e;
            --border: #242838;
            --text-main: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body.theme-vertical-dark, body {
            width: 100vw;
            max-width: 450px;
            min-height: 100vh;
            margin: 0 auto;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 24px;
            overflow-x: hidden;
        }

        /* CANVAS WIDTH 65% VIEWPORT RULE FOR 9:16 MOBILE UI SAFETY */
        .canvas-frame {
            width: 65%;
            max-width: 320px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* CARD STEP ANIMATION - JS Triggered */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            overflow: hidden;
            
            /* Initial Hidden State */
            opacity: 0;
            transform: translateY(28px) scale(0.92);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Visible State Triggered by JS */
        .card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--border);
        }

        .card-latency::before { background: var(--cyberk-red); }
        .card-lang::before { background: var(--cyberk-blue); }
        .card-availability::before { background: var(--cyberk-amber); }

        .card-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #090a0f;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        /* ENGLISH ULTRA-MINIMALIST 1-LINE CORE TITLE */
        .card-text {
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.01em;
            white-space: nowrap;
        }
    </style>
</head>
<body class="theme-vertical-dark">

    <div class="canvas-frame">

        <!-- Component 1: AI Response < 1s -->
        <div class="card card-latency" id="comp-1">
            <div class="card-icon">⏱️</div>
            <div class="card-text">AI Response &lt; 1s</div>
        </div>

        <!-- Component 2: English & Spanish Support -->
        <div class="card card-lang" id="comp-2">
            <div class="card-icon">🌐</div>
            <div class="card-text">English &amp; Spanish Support</div>
        </div>

        <!-- Component 3: 24/7 AI Availability -->
        <div class="card card-availability" id="comp-3">
            <div class="card-icon">🌙</div>
            <div class="card-text">24/7 AI Availability</div>
        </div>

    </div>

    <!-- JS SEQUENTIAL ANIMATION CONTROLLER WITH INITIAL RECORDING DELAY -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.card');
            const totalDuration = 4000; // 4 seconds total
            const stepInterval = totalDuration / cards.length; // 1333.3ms per step
            const initialStartDelay = 1500; // 1.5s delay to ensure screen recording catches frame 0

            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.classList.add('visible');
                }, initialStartDelay + (index * stepInterval));
            });
        });
    </script>
</body>
</html>
